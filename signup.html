<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Pick My AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body data-page="signup">
  <main class="auth-shell">
    <!-- Toggle Button Section Theme Change karwa mate -->
    <button id="themeToggle" class="theme-toggle" type="button">Switch Theme</button>
    <section class="auth-card">
      <div class="brand">✦</div>
      <h1>Create your account</h1>
      <p class="subtitle">Fill the details to get started.</p>

      <!-- Signup form na fields validation section, no backend, khali types define section  -->
      <form id="signupForm" action="signup.php" method="POST" novalidate>
        <div class="field-wrap">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" type="text" autocomplete="name" required />
          <div class="field-error" id="fullNameError"></div>
        </div>

        <div class="field-wrap">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
          <div class="field-error" id="emailError"></div>
        </div>

        <div class="field-wrap">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required />
          <div class="field-error" id="passwordError"></div>
        </div>

        <div class="field-wrap">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required />
          <div class="field-error" id="confirmPasswordError"></div>
        </div>

        <button class="submit-btn" type="submit">Create Account</button>
        <div id="statusMsg" class="status"></div>
      </form>

      <!-- Sign-in page mate ni link -->
      <p class="switch">Already have an account? <a href="signin.html">Sign in</a></p>
    </section>
  </main>

  <script src="auth.js"></script>
</body>
</html>

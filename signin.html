<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | Pick My AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body data-page="signin">
  <main class="auth-shell">
    <!-- Toggle Button Section Theme Change karwa mate -->
    <button id="themeToggle" class="theme-toggle" type="button">Switch Theme</button>
    <section class="auth-card">
      <div class="brand">✦</div>
      <h1>Sign in to Pick My AI</h1>
      <p class="subtitle">Welcome back. Enter your details to continue.</p>

       <!-- Sig-in form na fields validation section, no backend, khali types define section  -->
      <form id="signinForm" action="login.php" method="POST" novalidate>
        <div class="field-wrap">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
          <div class="field-error" id="emailError"></div>
        </div>

        <div class="field-wrap">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <div class="field-error" id="passwordError"></div>
        </div>

        <!-- Remember me toggle button only frontend design mate  -->
        <label class="remember-row" for="rememberMe">
          <input id="rememberMe" name="rememberMe" type="checkbox" />
          Remember me
        </label>

        <button class="submit-btn" type="submit">Continue</button>
        <div id="statusMsg" class="status"></div>
      </form>

      <!-- Sign-up page mate ni link -->
      <p class="switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </section>
  </main>

  <script src="auth.js"></script>
</body>
</html>
